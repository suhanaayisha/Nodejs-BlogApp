# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: recipe-box
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: EXPRESS_SESSION_KEY
        generateValue: true
      # set these in the Render dashboard, they are secrets used
      - key: DB_URI
        sync: false
      - key: CLOUDINARY_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
